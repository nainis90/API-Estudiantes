
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de estudiantes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .seccion {
            margin-top: 25px;
        }
    </style>
</head>

<body>
<div class="contenedor">

    <h1>Gestión de estudiantes</h1>

    <div class="seccion">
        <h2>Añadir estudiante</h2>

        <input id="nombre" placeholder="Nombre">
        <input id="edad" type="number" placeholder="Edad">

        <button onclick="crearEstudiante()">Añadir</button>
    </div>

    <div class="seccion">
        <h2>Buscar estudiante</h2>

        <input id="buscarId" type="number" placeholder="ID del estudiante">
        <button onclick="buscarEstudiante()">Buscar</button>

        <p id="resultado"></p>
    </div>

    <div class="seccion">
        <h2>Lista de estudiantes</h2>

        <button onclick="cargarEstudiantes()">Actualizar lista</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Edad</th>
                </tr>
            </thead>

            <tbody id="tabla"></tbody>
        </table>
    </div>

</div>

<script>
async function cargarEstudiantes() {
    const respuesta = await fetch("/estudiantes");
    const estudiantes = await respuesta.json();

    const tabla = document.getElementById("tabla");
    tabla.innerHTML = "";

    estudiantes.forEach(e => {
        tabla.innerHTML += `
            <tr>
                <td>${e.id}</td>
                <td>${e.nombre}</td>
                <td>${e.edad}</td>
            </tr>
        `;
    });
}

async function crearEstudiante() {
    const nombre = document.getElementById("nombre").value;
    const edad = Number(document.getElementById("edad").value);

    if (!nombre || !edad) {
        alert("Introduce nombre y edad");
        return;
    }

    const respuesta = await fetch("/estudiantes", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({nombre, edad})
    });

    if (respuesta.ok) {
        alert("Estudiante añadido correctamente");
        document.getElementById("nombre").value = "";
        document.getElementById("edad").value = "";
        cargarEstudiantes();
    } else {
        alert("Error al crear estudiante");
    }
}

async function buscarEstudiante() {
    const id = document.getElementById("buscarId").value;
    const resultado = document.getElementById("resultado");

    if (!id) {
        resultado.innerText = "Introduce un ID";
        return;
    }

    const respuesta = await fetch(`/estudiantes/${id}`);

    if (respuesta.ok) {
        const e = await respuesta.json();
        resultado.innerText =
            `ID: ${e.id} | Nombre: ${e.nombre} | Edad: ${e.edad}`;
    } else {
        resultado.innerText = "Estudiante no encontrado";
    }
}

cargarEstudiantes();
</script>

</body>
</html>
